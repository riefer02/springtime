name: springtime

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-springtime}
      POSTGRES_USER: ${DATABASE_USERNAME:-springtime}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-springtime}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: springtime-api:local
    restart: unless-stopped
    stop_grace_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      # Pass every .env variable through (including OIDC settings) when present.
      - path: .env
        required: false
    ports:
      # Loopback only by default. Change to "8080:8080" deliberately if you need LAN access.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      SUPPLIER_GATEWAY: ${SUPPLIER_GATEWAY:-local}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/springtime}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-springtime}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-springtime}
      BIGQUERY_LOCATION: ${BIGQUERY_LOCATION:-US}
      BIGQUERY_DEFAULT_DATASET: ${BIGQUERY_DEFAULT_DATASET:-}
      BIGQUERY_MAX_BYTES_BILLED: ${BIGQUERY_MAX_BYTES_BILLED:-1073741824}
      BIGQUERY_MAX_RESULTS: ${BIGQUERY_MAX_RESULTS:-1000}
      BIGQUERY_USE_QUERY_CACHE: ${BIGQUERY_USE_QUERY_CACHE:-true}
      BIGQUERY_READ_ONLY: ${BIGQUERY_READ_ONLY:-true}
      BIGQUERY_MAX_CONCURRENT_QUERIES: ${BIGQUERY_MAX_CONCURRENT_QUERIES:-8}
      BIGQUERY_ACQUIRE_TIMEOUT: ${BIGQUERY_ACQUIRE_TIMEOUT:-2s}
      BIGQUERY_QUERY_TIMEOUT: ${BIGQUERY_QUERY_TIMEOUT:-60s}
      BIGQUERY_WRITER_MAX_BYTES_BILLED: ${BIGQUERY_WRITER_MAX_BYTES_BILLED:-1073741824}
      BIGQUERY_WRITER_MAX_CONCURRENT_QUERIES: ${BIGQUERY_WRITER_MAX_CONCURRENT_QUERIES:-4}
      BIGQUERY_WRITER_ACQUIRE_TIMEOUT: ${BIGQUERY_WRITER_ACQUIRE_TIMEOUT:-2s}
      RETAIL_DATASET: ${RETAIL_DATASET:-retail_demo}
      RETAIL_DEFAULT_PAGE_SIZE: ${RETAIL_DEFAULT_PAGE_SIZE:-50}
      RETAIL_MAX_PAGE_SIZE: ${RETAIL_MAX_PAGE_SIZE:-200}
      RETAIL_DEMAND_WINDOW_DAYS: ${RETAIL_DEMAND_WINDOW_DAYS:-28}
      RETAIL_TARGET_COVER_DAYS: ${RETAIL_TARGET_COVER_DAYS:-14}
      RETAIL_MAX_BYTES_BILLED: ${RETAIL_MAX_BYTES_BILLED:-268435456}
      RETAIL_CURRENCY: ${RETAIL_CURRENCY:-USD}
      RETAIL_EVENT_MAX_FUTURE_SKEW: ${RETAIL_EVENT_MAX_FUTURE_SKEW:-5m}
      RETAIL_EVENT_MAX_AGE: ${RETAIL_EVENT_MAX_AGE:-365d}
      RETAIL_RECONCILIATION_TOLERANCE: ${RETAIL_RECONCILIATION_TOLERANCE:-0}
      RETAIL_BUSINESS_ZONE: ${RETAIL_BUSINESS_ZONE:-UTC}
      RETAIL_LEDGER_BATCH_ENABLED: ${RETAIL_LEDGER_BATCH_ENABLED:-true}
      RETAIL_LEDGER_BATCH_SIZE: ${RETAIL_LEDGER_BATCH_SIZE:-100}
      RETAIL_LEDGER_BATCH_LINGER_MS: ${RETAIL_LEDGER_BATCH_LINGER_MS:-25}
      RETAIL_LEDGER_BATCH_MAX_PENDING: ${RETAIL_LEDGER_BATCH_MAX_PENDING:-2000}
      RETAIL_LEDGER_BATCH_MAX_PENDING_BYTES: ${RETAIL_LEDGER_BATCH_MAX_PENDING_BYTES:-33554432}
      RETAIL_LEDGER_BATCH_WAIT_TIMEOUT: ${RETAIL_LEDGER_BATCH_WAIT_TIMEOUT:-75s}
      RETAIL_PROJECTION_ENABLED: ${RETAIL_PROJECTION_ENABLED:-false}
      RETAIL_PROJECTION_INTERVAL_MS: ${RETAIL_PROJECTION_INTERVAL_MS:-900000}
      RETAIL_PROJECTION_LOOKBACK_DAYS: ${RETAIL_PROJECTION_LOOKBACK_DAYS:-7}
      MESSAGING_PUBSUB_ENABLED: ${MESSAGING_PUBSUB_ENABLED:-false}
      MESSAGING_EVENTS_TOPIC: ${MESSAGING_EVENTS_TOPIC:-retail-events}
      MESSAGING_DLQ_TOPIC: ${MESSAGING_DLQ_TOPIC:-retail-events-dlq}
      MESSAGING_SUBSCRIPTION: ${MESSAGING_SUBSCRIPTION:-retail-events-worker}
      MESSAGING_CONSUMER_ENABLED: ${MESSAGING_CONSUMER_ENABLED:-true}
      MESSAGING_LOCAL_CONSUMER_ENABLED: ${MESSAGING_LOCAL_CONSUMER_ENABLED:-true}
      MESSAGING_LOCAL_CONSUMER_POLL_INTERVAL_MS: ${MESSAGING_LOCAL_CONSUMER_POLL_INTERVAL_MS:-500}
      MESSAGING_MAX_IN_MEMORY_MESSAGES: ${MESSAGING_MAX_IN_MEMORY_MESSAGES:-1000}
      MESSAGING_RETRY_MAX_ATTEMPTS: ${MESSAGING_RETRY_MAX_ATTEMPTS:-5}
      MESSAGING_RETRY_INITIAL_DELAY: ${MESSAGING_RETRY_INITIAL_DELAY:-200ms}
      MESSAGING_RETRY_MULTIPLIER: ${MESSAGING_RETRY_MULTIPLIER:-2.0}
      MESSAGING_RETRY_MAX_DELAY: ${MESSAGING_RETRY_MAX_DELAY:-10s}
      MESSAGING_RETRY_JITTER: ${MESSAGING_RETRY_JITTER:-0.2}
      SUPPLIER_OUTBOX_ENABLED: ${SUPPLIER_OUTBOX_ENABLED:-true}
      SUPPLIER_OUTBOX_WORKER_ENABLED: ${SUPPLIER_OUTBOX_WORKER_ENABLED:-true}
      SUPPLIER_OUTBOX_POLL_INTERVAL_MS: ${SUPPLIER_OUTBOX_POLL_INTERVAL_MS:-5000}
      SUPPLIER_OUTBOX_BATCH_SIZE: ${SUPPLIER_OUTBOX_BATCH_SIZE:-20}
      SUPPLIER_OUTBOX_MAX_ATTEMPTS: ${SUPPLIER_OUTBOX_MAX_ATTEMPTS:-8}
      SUPPLIER_OUTBOX_INITIAL_DELAY: ${SUPPLIER_OUTBOX_INITIAL_DELAY:-1s}
      SUPPLIER_OUTBOX_MULTIPLIER: ${SUPPLIER_OUTBOX_MULTIPLIER:-2.0}
      SUPPLIER_OUTBOX_MAX_DELAY: ${SUPPLIER_OUTBOX_MAX_DELAY:-5m}
      SUPPLIER_OUTBOX_JITTER: ${SUPPLIER_OUTBOX_JITTER:-0.2}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-262144}
      MAX_SQL_LENGTH: ${MAX_SQL_LENGTH:-100000}
      MAX_PARAMETER_VALUE_LENGTH: ${MAX_PARAMETER_VALUE_LENGTH:-65536}
      MAX_PARAMETERS: ${MAX_PARAMETERS:-100}
      MAX_RESPONSE_BYTES: ${MAX_RESPONSE_BYTES:-5000000}
      ACCESS_LOG_ENABLED: ${ACCESS_LOG_ENABLED:-true}
      PAGE_DEFAULT_SIZE: ${PAGE_DEFAULT_SIZE:-100}
      PAGE_MAX_SIZE: ${PAGE_MAX_SIZE:-1000}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-true}
      API_KEY: ${API_KEY:-}
      API_KEY_PREVIOUS: ${API_KEY_PREVIOUS:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      OIDC_ALLOWED_SUBJECTS: ${OIDC_ALLOWED_SUBJECTS:-}
      # For OIDC, set these in the host environment; leave unset for API-key mode:
      # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
      # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES
    volumes:
      # Application Default Credentials from `gcloud auth application-default login`.
      # Override GCLOUD_CONFIG_DIR in .env if your gcloud config lives elsewhere.
      - type: bind
        source: ${GCLOUD_CONFIG_DIR:-${HOME}/.config/gcloud}
        target: /home/app/.config/gcloud
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  postgres-data:
