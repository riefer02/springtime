name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: springtime
          POSTGRES_USER: springtime
          POSTGRES_PASSWORD: springtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U springtime -d springtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Build container
        run: docker build --tag springtime-api:ci .

      - name: Start container
        run: |
          docker run -d --name springtime-ci \
            -p 18080:8080 \
            --add-host=host.docker.internal:host-gateway \
            -e GOOGLE_CLOUD_PROJECT=ci-project \
            -e API_KEY=ci-key-0123456789abcdef0123456789 \
            -e SUPPLIER_GATEWAY=local \
            -e SUPPLIER_OUTBOX_WORKER_ENABLED=false \
            -e MESSAGING_LOCAL_CONSUMER_ENABLED=false \
            -e FLYWAY_ENABLED=true \
            -e DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/springtime \
            -e DATABASE_USERNAME=springtime \
            -e DATABASE_PASSWORD=springtime \
            -e SPRINGDOC_ENABLED=true \
            springtime-api:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:18080/actuator/health/liveness >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:18080/actuator/health/liveness
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-API-Key: ci-key-0123456789abcdef0123456789' http://localhost:18080/api/v1/retail/purchase-orders)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/v3/api-docs)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-API-Key: ci-key-0123456789abcdef0123456789' http://localhost:18080/openapi/springtime-v1.json)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:18080/api/v1/query -H 'Content-Type: application/json' -d '{"sql":"SELECT 1"}')" = "401"
          curl -s -X POST http://localhost:18080/api/v1/query -H 'Content-Type: application/json' -d '{"sql":"SELECT 1"}' | grep -q '"code":"AUTHENTICATION_REQUIRED"'
          curl -s -D - -o /dev/null http://localhost:18080/actuator/health/liveness | grep -qi 'X-API-Version: 1' || true
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-API-Key: ci-key-0123456789abcdef0123456789' http://localhost:18080/actuator/prometheus)" = "200"

      - name: Container logs
        if: failure()
        run: docker logs springtime-ci

      - name: Cleanup
        if: always()
        run: docker rm -f springtime-ci || true

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Prometheus alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/ops/prometheus:/rules:ro" \
            prom/prometheus:v2.55.1 check rules /rules/springtime-alerts.yml

      - name: Validate Grafana dashboard JSON
        run: jq empty ops/observability/grafana/dashboards/springtime-overview.json

      - name: Validate Alertmanager routing
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD/ops/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml

      - name: Validate Grafana Alloy config
        run: |
          docker run --rm -v "$PWD/ops/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.8.2 fmt /etc/alloy/config.alloy > /dev/null

      - name: Validate Compose overlay
        run: API_KEY=ci-key-0123456789abcdef0123456789 docker compose -f compose.yaml -f compose.observability.yaml config -q

      - name: Validate k6 scenarios
        run: |
          for script in smoke event-intake retail-read mixed; do
            docker run --rm -v "$PWD/ops/loadtest:/scripts:ro" \
              grafana/k6:0.54.0 inspect "/scripts/$script.js" > /dev/null
          done

      - name: Shell syntax of chaos and deploy scripts
        run: bash -n ops/chaos/*.sh ops/demo/*.sh deploy/gcp/*.sh
