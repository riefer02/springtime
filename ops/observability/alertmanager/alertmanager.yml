# Agnotic alert routing. The default receiver is a no-op so rules can be evaluated and inspected in
# the Prometheus/Alertmanager UI without an external dependency.
#
# Connect your channel by adding a receiver and pointing the route at it, for example:
#
#   receivers:
#     - name: default
#     - name: webhook
#       webhook_configs:
#         - url: https://alerts.example.com/springtime
#           send_resolved: true
#
#   route:
#     receiver: webhook
#
# Slack/email/PagerDuty use the same route shape; see the Alertmanager documentation.
route:
  receiver: default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
