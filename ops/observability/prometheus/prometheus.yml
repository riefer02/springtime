global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: springtime
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: springtime
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["metrics-proxy:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
