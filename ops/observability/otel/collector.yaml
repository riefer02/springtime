receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    send_batch_size: 256
    send_batch_max_size: 512
    timeout: 5s

exporters:
  # Open-source default: the local Tempo instance. Point this at any OTLP backend instead.
  otlphttp/tempo:
    endpoint: http://tempo:4318
    tls:
      insecure: true
  # Keep a debug line so a missing trace is diagnosable without a backend.
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tempo, debug]
